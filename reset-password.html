<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid-pattern {
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen bg-grid-pattern">
    <div class="bg-gray-800 p-8 rounded-lg shadow-2xl max-w-md w-full border border-gray-700">
        <h2 class="text-3xl font-bold mb-2 text-center text-blue-500">Reset Password</h2>
        <p class="text-gray-400 text-center mb-6 text-sm">Enter your new password below.</p>
        
        <form id="new-password-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">New Password</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-md transition-transform duration-300 hover:scale-105 flex justify-center items-center">
                <span>Update Password</span>
            </button>
        </form>
        
        <div id="status-message" class="hidden mt-4 p-3 rounded text-center text-sm"></div>
    </div>

    <script>
        const form = document.getElementById('new-password-form');
        const statusMsg = document.getElementById('status-message');
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const btn = form.querySelector('button');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            // UX: Loading State
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            btn.disabled = true;

            try {
                const res = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                
                statusMsg.textContent = data.message;
                statusMsg.classList.remove('hidden');
                
                if(res.ok) {
                    statusMsg.className = "mt-4 p-3 rounded text-center text-sm bg-green-900 text-green-200 border border-green-700";
                    setTimeout(() => window.location.href = '/', 2000);
                } else {
                    statusMsg.className = "mt-4 p-3 rounded text-center text-sm bg-red-900 text-red-200 border border-red-700";
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                statusMsg.textContent = "An error occurred. Please try again.";
                statusMsg.className = "mt-4 p-3 rounded text-center text-sm bg-red-900 text-red-200 border border-red-700";
                statusMsg.classList.remove('hidden');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
